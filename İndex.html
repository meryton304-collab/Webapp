<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pazarım</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #f5f5f5;
  color: #222;
  padding-bottom: 100px;
}

header {
  background: white;
  padding: 18px 15px 12px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px #ddd;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: #16a34a;
  margin-bottom: 14px;
}

.search {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #ddd;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
}

.container {
  padding: 15px;
}

h2 {
  margin: 10px 0 15px;
}

.categories {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
}

.category {
  background: white;
  padding: 12px 15px;
  border-radius: 12px;
  white-space: nowrap;
  border: 1px solid #eee;
}

.products {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.product {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 7px #ddd;
}

.product img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.info {
  padding: 10px;
}

.title {
  font-size: 15px;
  margin-bottom: 7px;
}

.price {
  font-size: 18px;
  font-weight: bold;
  color: #16a34a;
}

.location {
  font-size: 12px;
  color: #777;
  margin-top: 6px;
}

.add {
  position: fixed;
  right: 20px;
  bottom: 135px;
  background: #16a34a;
  color: white;
  border: none;
  padding: 15px 20px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: bold;
  box-shadow: 0 4px 12px #aaa;
}

footer {
  padding: 12px 15px;
  text-align: center;
  background: #fff;
  border-top: 1px solid #eee;
  position: fixed;
  left: 0;
  right: 0;
  bottom: 60px;
}

footer a {
  color: #16a34a;
  font-weight: 600;
  text-decoration: none;
}

/* Yeni iletişim butonu stili */
footer .contact {
  display: inline-block;
  margin-left: 12px;
  margin-top: 8px;
  background: #16a34a;
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 60px;
  background: white;
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid #ddd;
  z-index: 20;
}

nav div {
  text-align: center;
  font-size: 12px;
}

nav span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🛍️ Pazarım</div>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Ürün, marka veya kategori ara..."
    onkeyup="searchProducts()"
  >
</header>

<div class="container">

<h2>Kategoriler</h2>

<div class="categories">
  <div class="category">🚗 Araç</div>
  <div class="category">📱 Telefon</div>
  <div class="category">💻 Elektronik</div>
  <div class="category">👕 Giyim</div>
  <div class="category">🏠 Ev</div>
  <div class="category">🪑 Mobilya</div>
</div>

<h2>Yeni İlanlar</h2>

<div class="products" id="products">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600">
    <div class="info">
      <div class="title">iPhone 15 128 GB</div>
      <div class="price">32.500 TL</div>
      <div class="location">📍 İstanbul</div>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600">
    <div class="info">
      <div class="title">Nike Spor Ayakkabı</div>
      <div class="price">1.500 TL</div>
      <div class="location">📍 Ankara</div>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600">
    <div class="info">
      <div class="title">Motosiklet</div>
      <div class="price">85.000 TL</div>
      <div class="location">📍 İzmir</div>
    </div>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600">
    <div class="info">
      <div class="title">Modern Koltuk</div>
      <div class="price">7.500 TL</div>
      <div class="location">📍 Bursa</div>
    </div>
  </div>

</div>
</div>

<button class="add" onclick="newListing()">
  ＋ İlan Ver
</button>

<footer>
  <a href="https://t.me/Selm3214" target="_blank" rel="noopener noreferrer">
    Telegram: @Selm3214
  </a>
  <button class="contact" onclick="openTelegram()" aria-label="Telegram ile iletişime geç">İletişime Geç</button>
</footer>

<nav>
  <div><span>🏠</span>Ana Sayfa</div>
  <div><span>🔍</span>Ara</div>
  <div><span>❤️</span>Favoriler</div>
  <div><span>👤</span>Hesabım</div>
</nav>

<script>

function searchProducts() {
  let text = document.getElementById("search").value.toLowerCase();
  let products = document.querySelectorAll(".product");

  products.forEach(function(product) {
    let title = product.querySelector(".title").innerText.toLowerCase();

    if (title.includes(text)) {
      product.style.display = "block";
    } else {
      product.style.display = "none";
    }
  });
}

function newListing() {
  alert("İlan verme ekranını bir sonraki aşamada ekleyeceğiz.");
}

function openTelegram() {
  // Telegram uygulamasını dene; çalışmazsa web'e yönlendir
  var tgUrl = "tg://resolve?domain=Selm3214";
  var webUrl = "https://t.me/Selm3214";

  // Safari/Chrome gibi tarayıcılarda doğrudan tg://'yi açmayı dene
  window.location.href = tgUrl;

  // Eğer uygulama açılmazsa 700ms sonra web sürümünü yeni sekmede aç
  setTimeout(function() {
    window.open(webUrl, "_blank");
  }, 700);
}

</script>

</body>
</html>
